# Unified MFE Deployment Workflow
# Implements: MDP-Requirement-1 through MDP-Requirement-7
# Dynamically detects which MFE changed and deploys only that MFE
# Replaces per-MFE workflows with a single scalable workflow
# See: openspec/changes/azure-blob-deployment-pipeline/specs/mfe-deployment-pipeline/spec.md

name: Deploy MFEs

"on":
  push:
    branches:
      - main
    tags:
      # Trigger on any MFE version tag (pattern: mfe-<name>-v<semver>)
      - 'mfe-*-v*'
    paths:
      # Trigger on any MFE changes
      - 'apps/mfes/**'
      # Trigger on shared package changes (will deploy all MFEs)
      - 'packages/dynamic-loader/**'
      - 'packages/events/**'
      # Trigger on this workflow itself
      - '.github/workflows/deploy-mfes.yml'

permissions:
  id-token: write      # Required for Azure OIDC authentication
  contents: read       # Required to checkout code
  pull-requests: write # Required to open PR for config updates

jobs:
  # Detect which MFEs changed (for dev deploys on push to main)
  detect-changed-mfes:
    name: Detect Changed MFEs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need previous commit for diff

      - name: Detect changed MFEs
        id: detect
        run: |
          # Get list of all MFEs
          ALL_MFES=$(ls -d apps/mfes/mfe-* 2>/dev/null | xargs -n1 basename | jq -R -s -c 'split("\n") | map(select(length > 0))')
          
          # Check which files changed in this push
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          
          # Check if shared packages changed (deploy all MFEs)
          if echo "$CHANGED_FILES" | grep -qE '^packages/(dynamic-loader|events)/'; then
            echo "Shared package changed, deploying all MFEs"
            echo "matrix={\"mfe\":$(echo $ALL_MFES | jq -c .)}" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Detect which specific MFEs changed
          CHANGED_MFES=$(echo "$CHANGED_FILES" | grep '^apps/mfes/mfe-' | cut -d/ -f3 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          
          if [ "$(echo $CHANGED_MFES | jq '. | length')" -gt 0 ]; then
            echo "Changed MFEs: $CHANGED_MFES"
            echo "matrix={\"mfe\":$CHANGED_MFES}" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No MFE changes detected"
            echo "matrix={\"mfe\":[]}" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  # Extract MFE name from tag (for prod deploys)
  detect-tagged-mfe:
    name: Detect Tagged MFE
    if: startsWith(github.ref, 'refs/tags/mfe-')
    runs-on: ubuntu-latest
    outputs:
      mfe_name: ${{ steps.extract.outputs.mfe_name }}
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Extract MFE name and version from tag
        id: extract
        run: |
          # Tag format: mfe-widget-v1.2.0 or mfe-landing-page-v0.1.0
          TAG_NAME="${GITHUB_REF_NAME}"
          
          # Extract version (everything after final '-v')
          VERSION=$(echo "$TAG_NAME" | sed -E 's/.*-v([0-9].*)/\1/')
          
          # Extract MFE name (everything before '-v<version>')
          MFE_NAME=$(echo "$TAG_NAME" | sed -E "s/-v${VERSION}$//")
          
          echo "mfe_name=$MFE_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected MFE: $MFE_NAME, Version: $VERSION"

  # Validate version for prod deploys (MDP-Requirement-3)
  validate-version:
    name: Validate Version
    if: startsWith(github.ref, 'refs/tags/mfe-')
    needs: detect-tagged-mfe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read package.json version
        id: package
        run: |
          MFE_NAME="${{ needs.detect-tagged-mfe.outputs.mfe_name }}"
          TAG_VERSION="${{ needs.detect-tagged-mfe.outputs.version }}"
          
          PKG_VERSION=$(jq -r '.version' "apps/mfes/$MFE_NAME/package.json")
          echo "package_version=$PKG_VERSION" >> $GITHUB_OUTPUT
          echo "Package.json version: $PKG_VERSION"

      - name: Compare versions
        run: |
          TAG_VERSION="${{ needs.detect-tagged-mfe.outputs.version }}"
          PKG_VERSION="${{ steps.package.outputs.package_version }}"
          MFE_NAME="${{ needs.detect-tagged-mfe.outputs.mfe_name }}"
          
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch for $MFE_NAME! Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            echo "::error::Please update apps/mfes/$MFE_NAME/package.json to version $TAG_VERSION before tagging"
            exit 1
          fi
          
          echo "✓ Version validation passed: $TAG_VERSION"

  # Dev deployment (runs for each changed MFE) - Implements MDP-Requirement-1
  deploy-dev:
    name: Deploy ${{ matrix.mfe }} to Dev
    if: needs.detect-changed-mfes.outputs.has_changes == 'true'
    needs: detect-changed-mfes
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      matrix: ${{ fromJson(needs.detect-changed-mfes.outputs.matrix) }}
      fail-fast: false  # Continue deploying other MFEs if one fails
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get package name
        id: package
        run: |
          PKG_NAME=$(jq -r '.name' "apps/mfes/${{ matrix.mfe }}/package.json")
          echo "package_name=$PKG_NAME" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build MFE
        run: pnpm --filter "${{ steps.package.outputs.package_name }}" build
        env:
          NODE_ENV: production

      # Implements OIDC-Requirement-1: Authenticate via OIDC (no client-secret)
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEV }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Implements MDP-Requirement-5: Dev overwrites floating pointer
      - name: Upload to Azure Blob Storage (Dev)
        run: |
          az storage blob upload-batch \
            --account-name tssmfestorage \
            --destination mfes-dev \
            --destination-path "${{ matrix.mfe }}/dev" \
            --source "apps/mfes/${{ matrix.mfe }}/dist" \
            --overwrite true \
            --content-cache-control "no-cache, must-revalidate" \
            --auth-mode login

      - name: Dev deployment summary
        run: |
          echo "### ✓ Dev Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**MFE**: ${{ matrix.mfe }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: dev" >> $GITHUB_STEP_SUMMARY
          echo "**Entry URL**: https://tssmfestorage.blob.core.windows.net/mfes-dev/${{ matrix.mfe }}/dev/remoteEntry.js" >> $GITHUB_STEP_SUMMARY
          echo "**Cache-Control**: no-cache, must-revalidate" >> $GITHUB_STEP_SUMMARY

  # Prod deployment (runs for tagged MFE) - Implements MDP-Requirement-2
  deploy-prod:
    name: Deploy ${{ needs.detect-tagged-mfe.outputs.mfe_name }} to Prod
    if: startsWith(github.ref, 'refs/tags/mfe-')
    needs: [detect-tagged-mfe, validate-version]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get package name
        id: package
        run: |
          MFE_NAME="${{ needs.detect-tagged-mfe.outputs.mfe_name }}"
          PKG_NAME=$(jq -r '.name' "apps/mfes/$MFE_NAME/package.json")
          echo "package_name=$PKG_NAME" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build MFE
        run: pnpm --filter "${{ steps.package.outputs.package_name }}" build
        env:
          NODE_ENV: production

      # Implements OIDC-Requirement-1: Authenticate via OIDC (no client-secret)
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PROD }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Implements MDP-Requirement-4: Refuse to overwrite versioned path
      - name: Check if version already exists
        id: version_check
        run: |
          VERSION="${{ needs.detect-tagged-mfe.outputs.version }}"
          MFE_NAME="${{ needs.detect-tagged-mfe.outputs.mfe_name }}"
          CONTAINER="mfes-prod"
          PREFIX="$MFE_NAME/v${VERSION}/"
          
          echo "Checking if version v${VERSION} already exists for $MFE_NAME..."
          
          EXISTING=$(az storage blob list \
            --account-name tssmfestorage \
            --container-name "$CONTAINER" \
            --prefix "$PREFIX" \
            --auth-mode login \
            --query "length([?name])" \
            --output tsv)
          
          if [ "$EXISTING" -gt 0 ]; then
            echo "::error::Version v${VERSION} already exists in production for $MFE_NAME!"
            echo "::error::Found $EXISTING blob(s) at path $PREFIX"
            echo "::error::Refusing to overwrite existing versioned artifacts"
            exit 1
          fi
          
          echo "✓ Version v${VERSION} does not exist in prod, proceeding with upload"

      # Implements MDP-Requirement-6: Immutable cache header for versioned artifacts
      - name: Upload to Azure Blob Storage (Prod)
        run: |
          VERSION="${{ needs.detect-tagged-mfe.outputs.version }}"
          MFE_NAME="${{ needs.detect-tagged-mfe.outputs.mfe_name }}"
          
          az storage blob upload-batch \
            --account-name tssmfestorage \
            --destination mfes-prod \
            --destination-path "$MFE_NAME/v${VERSION}" \
            --source "apps/mfes/$MFE_NAME/dist" \
            --overwrite false \
            --content-cache-control "public, max-age=31536000, immutable" \
            --auth-mode login

      - name: Prod deployment summary
        run: |
          VERSION="${{ needs.detect-tagged-mfe.outputs.version }}"
          MFE_NAME="${{ needs.detect-tagged-mfe.outputs.mfe_name }}"
          echo "### ✓ Prod Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**MFE**: $MFE_NAME" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Entry URL**: https://tssmfestorage.blob.core.windows.net/mfes-prod/$MFE_NAME/v${VERSION}/remoteEntry.js" >> $GITHUB_STEP_SUMMARY
          echo "**Cache-Control**: public, max-age=31536000, immutable" >> $GITHUB_STEP_SUMMARY

      # Implements MDP-Requirement-7: Open PR to update remotes.config.prod.json
      - name: Update remotes.config.prod.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.detect-tagged-mfe.outputs.version }}"
          MFE_NAME="${{ needs.detect-tagged-mfe.outputs.mfe_name }}"
          BRANCH="bots/pin-$MFE_NAME-v${VERSION}"
          CONFIG_FILE="apps/shells/website/public/remotes.config.prod.json"
          
          # Get route path from remotes.config.prod.json
          ROUTE_PATH=$(jq -r --arg mfe "$MFE_NAME" '.features | to_entries[] | select(.value.entryUrl | contains($mfe)) | .key' "$CONFIG_FILE" | head -n1)
          
          if [ -z "$ROUTE_PATH" ]; then
            echo "::error::Could not find route for $MFE_NAME in $CONFIG_FILE"
            echo "::error::Please add an entry for this MFE in the config before deploying"
            exit 1
          fi
          
          echo "Found route: $ROUTE_PATH for $MFE_NAME"
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Fetch and checkout main
          git fetch origin main
          git checkout main
          
          # Create new branch
          git checkout -b "$BRANCH"
          
          # Update the config file using jq
          jq --arg route "$ROUTE_PATH" \
             --arg version "$VERSION" \
             --arg url "https://tssmfestorage.blob.core.windows.net/mfes-prod/$MFE_NAME/v${VERSION}/remoteEntry.js" \
             '.features[$route].entryUrl = $url | .features[$route].version = $version' \
             "$CONFIG_FILE" > "${CONFIG_FILE}.tmp"
          mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
          
          # Commit and push
          git add "$CONFIG_FILE"
          git commit -m "chore(deploy): pin $MFE_NAME to v${VERSION}

Automated update from prod deployment workflow.

Tag: $MFE_NAME-v${VERSION}
Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          git push origin "$BRANCH"
          
          # Create pull request (without auto-merge)
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(deploy): pin $MFE_NAME to v${VERSION}" \
            --body "## MFE Production Deployment

**MFE**: $MFE_NAME
**Version**: v${VERSION}
**Tag**: [\`$MFE_NAME-v${VERSION}\`](${{ github.server_url }}/${{ github.repository }}/releases/tag/$MFE_NAME-v${VERSION})
**Workflow**: [Run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

### Changes
- Updates \`$MFE_NAME\` entry URL to versioned prod path
- Sets version to \`${VERSION}\`
- Route: \`$ROUTE_PATH\`

### Entry URL
\`\`\`
https://tssmfestorage.blob.core.windows.net/mfes-prod/$MFE_NAME/v${VERSION}/remoteEntry.js
\`\`\`

### Verification
After merging, the prod shell will load \`$MFE_NAME\` from the newly published version.

---
🤖 Automated PR from MFE deployment workflow"

      - name: PR creation summary
        run: |
          VERSION="${{ needs.detect-tagged-mfe.outputs.version }}"
          MFE_NAME="${{ needs.detect-tagged-mfe.outputs.mfe_name }}"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Configuration PR Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A pull request has been opened to update the prod shell configuration." >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: bots/pin-$MFE_NAME-v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**File**: apps/shells/website/public/remotes.config.prod.json" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **This PR is not auto-merged.** A human reviewer must approve and merge it." >> $GITHUB_STEP_SUMMARY
