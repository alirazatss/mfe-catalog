# Turborepo-Optimized MFE Deployment Workflow
# Uses Turborepo to intelligently detect changed packages and build only what's needed
# See: https://turbo.build/repo/docs/reference/run

name: Deploy MFEs (Turborepo-Optimized)

"on":
  push:
    branches:
      - main
    tags:
      # Trigger on any MFE version tag
      - "mfe-*-v*"
    paths:
      # Trigger on any MFE or package changes
      - "apps/mfes/**"
      - "packages/**"
      - "turbo.json"
      - ".github/workflows/deploy-mfes.yml"

permissions:
  id-token: write # Required for Azure OIDC authentication
  contents: read # Required to checkout code
  pull-requests: write # Required to open PR for config updates

jobs:
  # Turborepo detects changed MFEs intelligently
  detect-changed-mfes-turbo:
    name: Detect Changed MFEs (Turborepo)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for turbo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turborepo's dry-run shows what would be built
      - name: Detect changed MFEs using Turborepo
        id: detect
        run: |
          # Use turbo to detect what changed since last commit
          # --filter=[HEAD^1] means "packages changed since previous commit"
          # Parse the JSON dry-run output and keep only direct MFE directories
          CHANGED_PACKAGES=$(pnpm exec turbo build --dry-run=json --filter='[HEAD^1]' \
            | jq -c '[.tasks[].directory | select(startswith("apps/mfes/")) | sub("^apps/mfes/"; "") | select(contains("/") | not)] | unique')

          if [ -z "$CHANGED_PACKAGES" ] || [ "$CHANGED_PACKAGES" = "[]" ]; then
            echo "No MFE changes detected by Turborepo"
            echo "matrix={\"mfe\":[]}" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Turborepo detected changed MFEs: $CHANGED_PACKAGES"
            echo "matrix={\"mfe\":$CHANGED_PACKAGES}" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  # Extract MFE name from tag (for prod deploys)
  detect-tagged-mfe:
    name: Detect Tagged MFE
    if: startsWith(github.ref, 'refs/tags/mfe-')
    runs-on: ubuntu-latest
    outputs:
      mfe_name: ${{ steps.extract.outputs.mfe_name }}
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Extract MFE name and version from tag
        id: extract
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION=$(echo "$TAG_NAME" | sed -E 's/.*-v([0-9].*)/\1/')
          MFE_NAME=$(echo "$TAG_NAME" | sed -E "s/-v${VERSION}$//")

          echo "mfe_name=$MFE_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected MFE: $MFE_NAME, Version: $VERSION"

  # Validate version for prod deploys
  validate-version:
    name: Validate Version
    if: startsWith(github.ref, 'refs/tags/mfe-')
    needs: detect-tagged-mfe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read package.json version
        id: package
        run: |
          MFE_NAME="${{ needs.detect-tagged-mfe.outputs.mfe_name }}"
          TAG_VERSION="${{ needs.detect-tagged-mfe.outputs.version }}"

          PKG_VERSION=$(jq -r '.version' "apps/mfes/$MFE_NAME/package.json")
          echo "package_version=$PKG_VERSION" >> $GITHUB_OUTPUT
          echo "Package.json version: $PKG_VERSION"

      - name: Compare versions
        run: |
          TAG_VERSION="${{ needs.detect-tagged-mfe.outputs.version }}"
          PKG_VERSION="${{ steps.package.outputs.package_version }}"
          MFE_NAME="${{ needs.detect-tagged-mfe.outputs.mfe_name }}"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch for $MFE_NAME! Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

          echo "✓ Version validation passed: $TAG_VERSION"

  # Dev deployment using Turborepo for builds
  deploy-dev:
    name: Deploy ${{ matrix.mfe }} to Dev
    if: needs.detect-changed-mfes-turbo.outputs.has_changes == 'true'
    needs: detect-changed-mfes-turbo
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      matrix: ${{ fromJson(needs.detect-changed-mfes-turbo.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Turbo needs git history for remote cache

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Get package name
        id: package
        run: |
          PKG_NAME=$(jq -r '.name' "apps/mfes/${{ matrix.mfe }}/package.json")
          echo "package_name=$PKG_NAME" >> $GITHUB_OUTPUT

      # Turborepo installs only what's needed for this MFE
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turborepo builds this MFE and its dependencies
      # Uses cache from previous runs (local or remote)
      - name: Build MFE with Turborepo
        run: |
          pnpm exec turbo build --filter="${{ steps.package.outputs.package_name }}" \
            --output-logs=new-only
        env:
          NODE_ENV: production

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEV }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Upload to Azure Blob Storage (Dev)
        run: |
          az storage blob upload-batch \
            --account-name tssmfestorage \
            --destination mfes-dev \
            --destination-path "${{ matrix.mfe }}/dev" \
            --source "apps/mfes/${{ matrix.mfe }}/dist" \
            --overwrite true \
            --content-cache-control "no-cache, must-revalidate" \
            --auth-mode login

      - name: Dev deployment summary
        run: |
          echo "### ✓ Dev Deployment Successful (Turborepo-Optimized)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**MFE**: ${{ matrix.mfe }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: dev" >> $GITHUB_STEP_SUMMARY
          echo "**Build Tool**: Turborepo (cached dependencies)" >> $GITHUB_STEP_SUMMARY
          echo "**Entry URL**: https://tssmfestorage.blob.core.windows.net/mfes-dev/${{ matrix.mfe }}/dev/remoteEntry.js" >> $GITHUB_STEP_SUMMARY

  # Prod deployment using Turborepo
  deploy-prod:
    name: Deploy ${{ needs.detect-tagged-mfe.outputs.mfe_name }} to Prod
    if: startsWith(github.ref, 'refs/tags/mfe-')
    needs: [detect-tagged-mfe, validate-version]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Turbo needs git history

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Get package name
        id: package
        run: |
          MFE_NAME="${{ needs.detect-tagged-mfe.outputs.mfe_name }}"
          PKG_NAME=$(jq -r '.name' "apps/mfes/$MFE_NAME/package.json")
          echo "package_name=$PKG_NAME" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turborepo builds only what's needed, uses cache
      - name: Build MFE with Turborepo
        run: |
          pnpm exec turbo build --filter="${{ steps.package.outputs.package_name }}" \
            --output-logs=new-only
        env:
          NODE_ENV: production

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PROD }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check if version already exists
        id: version_check
        run: |
          VERSION="${{ needs.detect-tagged-mfe.outputs.version }}"
          MFE_NAME="${{ needs.detect-tagged-mfe.outputs.mfe_name }}"
          CONTAINER="mfes-prod"
          PREFIX="$MFE_NAME/v${VERSION}/"

          echo "Checking if version v${VERSION} already exists for $MFE_NAME..."

          EXISTING=$(az storage blob list \
            --account-name tssmfestorage \
            --container-name "$CONTAINER" \
            --prefix "$PREFIX" \
            --auth-mode login \
            --query "length([?name])" \
            --output tsv)

          if [ "$EXISTING" -gt 0 ]; then
            echo "::error::Version v${VERSION} already exists in production for $MFE_NAME!"
            exit 1
          fi

          echo "✓ Version v${VERSION} does not exist in prod, proceeding with upload"

      - name: Upload to Azure Blob Storage (Prod)
        run: |
          VERSION="${{ needs.detect-tagged-mfe.outputs.version }}"
          MFE_NAME="${{ needs.detect-tagged-mfe.outputs.mfe_name }}"

          az storage blob upload-batch \
            --account-name tssmfestorage \
            --destination mfes-prod \
            --destination-path "$MFE_NAME/v${VERSION}" \
            --source "apps/mfes/$MFE_NAME/dist" \
            --overwrite false \
            --content-cache-control "public, max-age=31536000, immutable" \
            --auth-mode login

      - name: Prod deployment summary
        run: |
          VERSION="${{ needs.detect-tagged-mfe.outputs.version }}"
          MFE_NAME="${{ needs.detect-tagged-mfe.outputs.mfe_name }}"
          echo "### ✓ Prod Deployment Successful (Turborepo-Optimized)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**MFE**: $MFE_NAME" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Tool**: Turborepo (cached dependencies)" >> $GITHUB_STEP_SUMMARY
          echo "**Entry URL**: https://tssmfestorage.blob.core.windows.net/mfes-prod/$MFE_NAME/v${VERSION}/remoteEntry.js" >> $GITHUB_STEP_SUMMARY

      - name: Update remotes.config.prod.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.detect-tagged-mfe.outputs.version }}"
          MFE_NAME="${{ needs.detect-tagged-mfe.outputs.mfe_name }}"
          BRANCH="bots/pin-$MFE_NAME-v${VERSION}"
          CONFIG_FILE="apps/shells/website/public/remotes.config.prod.json"

          # Get route path from remotes.config.prod.json
          ROUTE_PATH=$(jq -r --arg mfe "$MFE_NAME" '.features | to_entries[] | select(.value.entryUrl | contains($mfe)) | .key' "$CONFIG_FILE" | head -n1)

          if [ -z "$ROUTE_PATH" ]; then
            echo "::error::Could not find route for $MFE_NAME in $CONFIG_FILE"
            exit 1
          fi

          echo "Found route: $ROUTE_PATH for $MFE_NAME"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch and checkout main
          git fetch origin main
          git checkout main

          # Create new branch
          git checkout -b "$BRANCH"

          # Update the config file using jq
          jq --arg route "$ROUTE_PATH" \
             --arg version "$VERSION" \
             --arg url "https://tssmfestorage.blob.core.windows.net/mfes-prod/$MFE_NAME/v${VERSION}/remoteEntry.js" \
             '.features[$route].entryUrl = $url | .features[$route].version = $version' \
             "$CONFIG_FILE" > "${CONFIG_FILE}.tmp"
          mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"

          # Commit and push
          git add "$CONFIG_FILE"
          git commit \
            -m "chore(deploy): pin $MFE_NAME to v${VERSION}" \
            -m "Automated update from Turborepo-optimized deployment workflow." \
            -m "Tag: $MFE_NAME-v${VERSION}" \
            -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git push origin "$BRANCH"

          # Create pull request
          PR_BODY=$(printf '%s\n' \
            "## MFE Production Deployment (Turborepo-Optimized)" \
            "" \
            "**MFE**: $MFE_NAME" \
            "**Version**: v${VERSION}" \
            "**Tag**: $MFE_NAME-v${VERSION}" \
            "**Workflow**: Run #${{ github.run_number }}" \
            "" \
            "### Build Optimization" \
            "- Turborepo intelligent dependency detection" \
            "- Cached builds for unchanged dependencies" \
            "- Only affected packages rebuilt" \
            "" \
            "### Changes" \
            "- Updates $MFE_NAME entry URL to versioned prod path" \
            "- Sets version to ${VERSION}" \
            "- Route: $ROUTE_PATH" \
            "" \
            "### Entry URL" \
            "https://tssmfestorage.blob.core.windows.net/mfes-prod/$MFE_NAME/v${VERSION}/remoteEntry.js" \
            "" \
            "Automated PR from Turborepo-optimized MFE deployment workflow")

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(deploy): pin $MFE_NAME to v${VERSION}" \
            --body "$PR_BODY"

      - name: PR creation summary
        run: |
          VERSION="${{ needs.detect-tagged-mfe.outputs.version }}"
          MFE_NAME="${{ needs.detect-tagged-mfe.outputs.mfe_name }}"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Configuration PR Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A pull request has been opened to update the prod shell configuration." >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: bots/pin-$MFE_NAME-v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**File**: apps/shells/website/public/remotes.config.prod.json" >> $GITHUB_STEP_SUMMARY
