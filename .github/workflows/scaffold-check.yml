# Scaffold Drift Guard CI
# Implements app-scaffolding: drift guard requirement
# See: openspec/changes/mfe-shell-scaffolding/specs/app-scaffolding/spec.md
#
# Purpose: Ensures generator templates remain scaffoldable (no regressions)
# Triggers: Changes to turbo/generators/** or this workflow
# Process: Scaffold throwaway MFE + shell → install → typecheck → build → test
# All artifacts are throwaway (not committed or deployed)

name: Scaffold Drift Guard

on:
  pull_request:
    paths:
      # Trigger on generator changes
      - "turbo/generators/**"
      # Trigger on this workflow itself
      - ".github/workflows/scaffold-check.yml"
  push:
    branches:
      - main
    paths:
      - "turbo/generators/**"
      - ".github/workflows/scaffold-check.yml"

jobs:
  scaffold-check:
    name: Verify Templates Are Scaffoldable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Install dependencies
        run: pnpm install

      - name: Scaffold throwaway MFE
        run: |
          echo "drift-guard-mfe" | pnpm gen mfe
          echo "✅ MFE scaffolded successfully"

      - name: Scaffold throwaway shell
        run: |
          echo "drift-guard-shell" | pnpm gen shell
          echo "✅ Shell scaffolded successfully"

      - name: Install dependencies (after scaffolding)
        run: pnpm install

      - name: Typecheck throwaway MFE
        run: |
          echo "Running typecheck for drift-guard-mfe..."
          cd apps/mfes/mfe-drift-guard-mfe
          pnpm tsc --noEmit

      - name: Build throwaway MFE
        run: |
          echo "Building drift-guard-mfe..."
          pnpm turbo run build --filter='@mfe-runtime/mfe-drift-guard-mfe'

      - name: Test throwaway MFE
        run: |
          echo "Testing drift-guard-mfe..."
          pnpm turbo run test --filter='@mfe-runtime/mfe-drift-guard-mfe'

      - name: Typecheck throwaway shell
        run: |
          echo "Running typecheck for drift-guard-shell..."
          cd apps/shells/drift-guard-shell
          pnpm tsc --noEmit

      - name: Build throwaway shell
        run: |
          echo "Building drift-guard-shell..."
          pnpm turbo run build --filter='drift-guard-shell'

      - name: Test throwaway shell
        run: |
          echo "Testing drift-guard-shell..."
          pnpm turbo run test --filter='drift-guard-shell' || echo "No tests found (expected for shell)"

      - name: Summary
        if: success()
        run: |
          echo "✅ Scaffold drift guard passed!"
          echo "  - MFE scaffolded, built, and tested successfully"
          echo "  - Shell scaffolded, built, and tested successfully"
          echo "  - Templates are verified scaffoldable"
